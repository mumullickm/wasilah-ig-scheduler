name: Wasilah blog links publish

# Facebook-only link posts pointing at wasilah.site articles, published at
# 21:00 BD on the dates in links.json.
#
# Timing does NOT depend on this cron. run_links.py hands each post to
# Facebook's own scheduler (scheduled_publish_time), so Facebook publishes at
# the exact minute and the queue is visible in Business Suite's Scheduled tab.
# This daily tick is only a safety net: it registers anything in links.json
# that has not been handed over yet, so an added or edited entry still lands.
on:
  schedule:
    - cron: '0 3 * * *'   # 09:00 BD daily, well ahead of any 21:00 slot
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wasilah-publisher
  cancel-in-progress: false

jobs:
  publish-links:
    runs-on: ubuntu-latest
    steps:
      # `ref: main` resolves the branch at checkout time. A bare checkout pins
      # to the SHA from when the run was created, so a ledger commit landing in
      # between is invisible and the publisher re-posts what it already sent.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish due blog links (FB)
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: python3 run_links.py
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_links.json
          git diff --staged --quiet || git commit -m "state: update posted links [skip ci]"
          git push
