name: Wasilah inspect a post (manual)

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: Facebook post id
        required: true
      rescrape:
        description: also force Facebook to refetch every unpublished surah link
        required: false
        default: "false"
      scrape_url:
        description: refetch only this one url instead of the whole queue
        required: false
        default: ""

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          POST_ID: ${{ inputs.post_id }}
        run: python3 inspect_post.py
      - if: ${{ inputs.rescrape == 'true' }}
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          SCRAPE_URL: ${{ inputs.scrape_url }}
        run: python3 rescrape.py
