name: Wasilah Statics publish

# 2/day to Instagram + Facebook at 01:40 + 16:10 UTC (07:40 AM & 10:10 PM
# Dhaka), a few minutes after the scheduled 07:30/22:00 BD slots. Self-heals:
# any due-but-unposted static goes out on the next tick.
on:
  schedule:
    - cron: '40 1 * * *'
    - cron: '10 16 * * *'   # batch-1 PM 22:00 BD (ends 4 Aug)
    - cron: '5 7 * * *'     # batch-2 midday 13:00 BD (from 5 Aug)
    - cron: '5 15 * * *'    # showcase 21:00 BD daily (from 18 Jul)
    - cron: '35 15 * * *'   # showcase 21:30 BD on batch-1 reel days (to 3 Aug)
    - cron: '5 11 * * *'    # batch-3 17:00 BD slot (from 12 Sep)
    - cron: '35 16 * * *'   # batch-3 22:30 BD slot (from 12 Sep)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wasilah-publisher
  cancel-in-progress: false

jobs:
  publish-statics:
    runs-on: ubuntu-latest
    steps:
      # `ref: main` resolves the branch at checkout time. A bare checkout pins
      # to the SHA from when the run was created, so a ledger commit landing in
      # between is invisible and the publisher re-posts what it already sent.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish due statics (IG + FB)
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: python3 run_statics.py
      - name: Commit updated state
        run: |
          git config user.name "wasilah-bot"
          git config user.email "wasilah-bot@users.noreply.github.com"
          # Commit BEFORE rebasing. `git pull --rebase` refuses to run against a
          # dirty tree, and the publisher has just written the ledger, so the
          # pull failed on every run and `|| true` swallowed it. The rebase is
          # what lets this land when a sibling publisher pushed after checkout.
          git add posted_statics.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no state change"
            exit 0
          fi
          git commit -m "state: update posted statics [skip ci]"
          # The post already went out. An unrecorded ledger makes the next run
          # publish the same static again, so retry rather than drop it.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "ledger push attempt $i failed, retrying"
            sleep 5
          done
          echo "ledger push failed after 3 attempts; posted_statics.json is NOT saved" >&2
          exit 1
