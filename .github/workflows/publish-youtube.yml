name: Wasilah YouTube publish

# SIX ticks a day, ONE upload each, spread across Bangladesh peak hours instead
# of dumping the whole day's batch in a single evening run. reels.json carries
# the plan, so rest days simply find nothing due. Self-healing.
#
# Six a day is a HARD CEILING, not a choice. A video insert costs 1600 quota
# units against 10,000/day, so 6 x 1600 = 9600 and a 7th upload cannot succeed.
# Adding more ticks does not add capacity, it only adds runs that fail. Going
# past 6/day needs a YouTube API quota extension, which needs the compliance
# audit filed.
#
# THE QUOTA DAY RESETS AT MIDNIGHT PACIFIC, i.e. 07:00 UTC, NOT at midnight
# Dhaka. The slots below are chosen to put exactly six uploads inside one such
# window: five in the 08:00-17:00 UTC block and the 03:30 UTC one belonging to
# that same quota day. Nothing sits near the 07:00 UTC boundary, because a cron
# that drifts across it would put seven uploads in one quota day and the
# seventh would fail. Re-check this arithmetic before moving any slot.
#
# Dhaka is UTC+6.  Slot        Dhaka    UTC     why
#                  afternoon   14:00    08:00   post-lunch pickup
#                  evening     17:00    11:00   commute home
#                  prime       20:00    14:00   after maghrib, settled in
#                  prime       21:30    15:30   the proven Wasilah window
#                  late        23:00    17:00   wind-down scrolling
#                  morning     09:30    03:30   next calendar day, same quota day
#
# GitHub's scheduler is best-effort and can run 5-15 minutes late under load,
# so treat these as windows, not appointments. The margin to 07:00 UTC is hours.
#
# The per-run cap reads the repo variable YT_MAX_PER_RUN so it can be ramped
# without editing this file. It MUST stay at 1 while six ticks are scheduled:
# at 2 the day's quota is spent by the third run. It is deliberately low anyway
# while the reinstated account settles, because a burst of API uploads is what
# got it suspended on 1 Aug 2026.
# SUPERSEDED 2026-08-07: the six-tick drain above is history, kept because the
# quota arithmetic still governs any future ramp. YouTube now posts ONCE a day,
# from daily.json, the same asset TikTok posts, at 21:00 Dhaka. Miraz's
# instruction: the same post on every platform, and no day missed. Six a day on
# one channel and one on the other cannot satisfy that, and the quota ceiling is
# on YouTube's side, so YouTube is the one that slows down.
#
# The second tick is a RETRY, not a second post. Once the day's asset is in the
# ledger the next entry is dated tomorrow, so the 17:00 run finds nothing due and
# exits. It exists because on 2026-08-06 three scheduled runs were cancelled
# GitHub-side between 16:00 and 18:30 UTC and that day would otherwise be lost.
#
# Dhaka is UTC+6.  post   21:00 Dhaka   15:00 UTC   the proven slot
#                  retry  23:00 Dhaka   17:00 UTC   only fires if the post failed
on:
  schedule:
    - cron: '0 15 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      max_per_run:
        description: 'Uploads this run (1600 units each, 6/day ceiling shared with the six scheduled ticks)'
        required: false
        default: '1'

permissions:
  contents: write

concurrency:
  group: wasilah-publisher
  cancel-in-progress: false

jobs:
  publish-youtube:
    runs-on: ubuntu-latest
    steps:
      # `ref: main` is load-bearing, not tidiness. A bare checkout takes
      # github.sha, which for a scheduled run is the SHA of main at the moment
      # the run was CREATED, not when it starts. On 2026-08-03 a run created at
      # 17:25:20 checked out at 17:26:04 and still got the tree from before the
      # 17:25:20 ledger commit, so it saw an already-published video as
      # outstanding and uploaded a second copy of it. Resolving the branch at
      # checkout time is what makes the ledger authoritative.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish due reels to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_MAX_PER_RUN: ${{ github.event.inputs.max_per_run || vars.YT_MAX_PER_RUN || '1' }}
          # DRAIN off: daily.json is the plan and both channels honour it. Left as
          # a repo variable so a backlog can still be burned deliberately, but
          # turning it on breaks parity with TikTok until it is turned off again.
          YT_DRAIN: ${{ vars.YT_DRAIN || '0' }}
        run: python3 run_youtube.py
      - name: Commit updated state
        run: |
          git config user.name "wasilah-bot"
          git config user.email "wasilah-bot@users.noreply.github.com"
          # Commit BEFORE rebasing. `git pull --rebase` refuses to run against a
          # dirty tree, and run_youtube.py has just written the ledger, so the
          # pull failed on every single run and `|| true` swallowed it. The
          # rebase exists to let this land when a sibling publisher pushed after
          # checkout; ordered this way round it never protected anything.
          # ONE PATHSPEC PER CALL. `git add a b` stages NOTHING when b does not
          # exist, it just fails the whole command, and the `|| true` hides it.
          # That is how posted_youtube.json went uncommitted on 2026-08-07
          # after a real upload, which would have had the retry tick publish the
          # same video a second time.
          git add posted_youtube.json 2>/dev/null || true
          git add skipped_youtube.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no state change"
            exit 0
          fi
          git commit -m "state: update posted youtube [skip ci]"
          # A lost push here does not just skip a commit. The upload already
          # happened, so an unrecorded ledger makes the next run publish the
          # same video again, and a duplicate competes with the original and
          # reads as spam. Retry rather than drop it.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "ledger push attempt $i failed, retrying"
            sleep 5
          done
          echo "ledger push failed after 3 attempts; posted_youtube.json is NOT saved" >&2
          exit 1
