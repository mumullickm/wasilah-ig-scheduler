name: Wasilah YouTube publish

# Daily tick at 15:20 UTC (09:20 PM Dhaka), just after the reels slot so the same
# reel lands on IG, FB and YouTube the same evening. reels.json carries the plan,
# so rest days simply find nothing due. Self-healing.
#
# Runs ONCE a day on purpose: a video insert costs 1600 quota units against a
# 10,000/day cap, so YT_MAX_PER_RUN=6 (9600 units) is the hard ceiling. There is
# no room for a second daily run, and no room for a 7th upload.
#
# The scheduled cap reads the repo variable YT_MAX_PER_RUN so it can be ramped
# without editing this file. It is deliberately set low while the reinstated
# account settles, because a burst of API uploads is what got it suspended on
# 1 Aug 2026. Raise it with:  gh variable set YT_MAX_PER_RUN --body 6
on:
  schedule:
    - cron: '20 15 * * *'
  workflow_dispatch:
    inputs:
      max_per_run:
        description: 'Max uploads this run (1600 units each, 10000/day cap, 6 = ceiling)'
        required: false
        default: '6'

permissions:
  contents: write

concurrency:
  group: wasilah-publisher
  cancel-in-progress: false

jobs:
  publish-youtube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish due reels to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_MAX_PER_RUN: ${{ github.event.inputs.max_per_run || vars.YT_MAX_PER_RUN || '6' }}
          YT_DRAIN: ${{ vars.YT_DRAIN || '1' }}
        run: python3 run_youtube.py
      - name: Commit updated state
        run: |
          git config user.name "wasilah-bot"
          git config user.email "wasilah-bot@users.noreply.github.com"
          git pull --rebase origin main || true
          git add posted_youtube.json
          git diff --staged --quiet || git commit -m "state: update posted youtube [skip ci]"
          git push
