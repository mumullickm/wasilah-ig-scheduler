name: Wasilah YouTube publish

# Daily tick at 15:20 UTC (09:20 PM Dhaka), just after the reels slot so the same
# reel lands on IG, FB and YouTube the same evening. reels.json carries the plan,
# so rest days simply find nothing due. Self-healing.
#
# Runs ONCE a day on purpose: a video insert costs 1600 quota units against a
# 10,000/day cap, so YT_MAX_PER_RUN=5 (8000 units) leaves headroom for reads.
# A second daily run would blow the quota.
on:
  schedule:
    - cron: '20 15 * * *'
  workflow_dispatch:
    inputs:
      max_per_run:
        description: 'Max uploads this run (quota: 1600 units each, 10000/day)'
        required: false
        default: '5'

permissions:
  contents: write

concurrency:
  group: wasilah-publisher
  cancel-in-progress: false

jobs:
  publish-youtube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish due reels to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_MAX_PER_RUN: ${{ github.event.inputs.max_per_run || '5' }}
        run: python3 run_youtube.py
      - name: Commit updated state
        run: |
          git config user.name "wasilah-bot"
          git config user.email "wasilah-bot@users.noreply.github.com"
          git pull --rebase origin main || true
          git add posted_youtube.json
          git diff --staged --quiet || git commit -m "state: update posted youtube [skip ci]"
          git push
