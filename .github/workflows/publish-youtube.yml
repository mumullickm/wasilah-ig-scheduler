name: Wasilah YouTube publish

# SIX ticks a day, ONE upload each, spread across Bangladesh peak hours instead
# of dumping the whole day's batch in a single evening run. reels.json carries
# the plan, so rest days simply find nothing due. Self-healing.
#
# Six a day is a HARD CEILING, not a choice. A video insert costs 1600 quota
# units against 10,000/day, so 6 x 1600 = 9600 and a 7th upload cannot succeed.
# Adding more ticks does not add capacity, it only adds runs that fail. Going
# past 6/day needs a YouTube API quota extension, which needs the compliance
# audit filed.
#
# THE QUOTA DAY RESETS AT MIDNIGHT PACIFIC, i.e. 07:00 UTC, NOT at midnight
# Dhaka. The slots below are chosen to put exactly six uploads inside one such
# window: five in the 08:00-17:00 UTC block and the 03:30 UTC one belonging to
# that same quota day. Nothing sits near the 07:00 UTC boundary, because a cron
# that drifts across it would put seven uploads in one quota day and the
# seventh would fail. Re-check this arithmetic before moving any slot.
#
# Dhaka is UTC+6.  Slot        Dhaka    UTC     why
#                  afternoon   14:00    08:00   post-lunch pickup
#                  evening     17:00    11:00   commute home
#                  prime       20:00    14:00   after maghrib, settled in
#                  prime       21:30    15:30   the proven Wasilah window
#                  late        23:00    17:00   wind-down scrolling
#                  morning     09:30    03:30   next calendar day, same quota day
#
# GitHub's scheduler is best-effort and can run 5-15 minutes late under load,
# so treat these as windows, not appointments. The margin to 07:00 UTC is hours.
#
# The per-run cap reads the repo variable YT_MAX_PER_RUN so it can be ramped
# without editing this file. It MUST stay at 1 while six ticks are scheduled:
# at 2 the day's quota is spent by the third run. It is deliberately low anyway
# while the reinstated account settles, because a burst of API uploads is what
# got it suspended on 1 Aug 2026.
on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 11 * * *'
    - cron: '0 14 * * *'
    - cron: '30 15 * * *'
    - cron: '0 17 * * *'
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      max_per_run:
        description: 'Uploads this run (1600 units each, 6/day ceiling shared with the six scheduled ticks)'
        required: false
        default: '1'

permissions:
  contents: write

concurrency:
  group: wasilah-publisher
  cancel-in-progress: false

jobs:
  publish-youtube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish due reels to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_MAX_PER_RUN: ${{ github.event.inputs.max_per_run || vars.YT_MAX_PER_RUN || '1' }}
          YT_DRAIN: ${{ vars.YT_DRAIN || '1' }}
        run: python3 run_youtube.py
      - name: Commit updated state
        run: |
          git config user.name "wasilah-bot"
          git config user.email "wasilah-bot@users.noreply.github.com"
          git pull --rebase origin main || true
          git add posted_youtube.json
          git diff --staged --quiet || git commit -m "state: update posted youtube [skip ci]"
          git push
